name: Publicar versión web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pygbag
        run: pip install pygbag==0.9.3

      - name: Copiar solo el código del juego
        run: |
          mkdir -p web/depuracion
          cp -r main.py combate models mundo ui web/depuracion/
          if [ -d assets ]; then cp -r assets web/depuracion/; fi
          find web -name __pycache__ -prune -exec rm -rf {} +

      - name: Compilar para el navegador
        run: python -m pygbag --build --title "Depuración" web/depuracion

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/depuracion/build/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
